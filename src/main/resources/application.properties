spring.application.name=validador-documentos

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-5-mini

app.biometria.compreface.base-url=${COMPREFACE_BASE_URL:http://localhost:8000}
app.biometria.compreface.api-key=${COMPREFACE_API_KEY:}
app.biometria.compreface.threshold=${COMPREFACE_THRESHOLD:0.70}
app.biometria.compreface.det-prob-threshold=${COMPREFACE_DET_PROB_THRESHOLD:0.95}
app.biometria.compreface.limit=${COMPREFACE_LIMIT:1}
app.biometria.compreface.test-rotations=${COMPREFACE_TEST_ROTATIONS:true}
app.biometria.compreface.bidirectional=${COMPREFACE_BIDIRECTIONAL:true}
